# Farmer advisory texts: English, Kannada, Hindi, Tamil
# =====================================================
# !!! The Kannada, Hindi and Tamil texts were machine-drafted. A NATIVE SPEAKER
# !!! OF EACH LANGUAGE MUST CHECK AND CORRECT THE WORDING before farmers use it.
#     Export for review:  python -m backend.kannada_review export --lang hi   (or kn, ta)
#
# Placeholders in {braces} are filled in by backend/advisory.py - keep them exactly.
#   {trap_name} {pest_name} {pests} {predators} {pct} {days} {dry_hours} {hours}
#   {prob} {wind} {when} {time} {date} {neighbour} {km} {temp} {hum}

en:
  title: "KeetaSense - {trap_name}"
  action_SPRAY: "Action: SPRAY"
  action_RELEASE_BIOCONTROL: "Action: RELEASE BIOCONTROL (do not spray)"
  action_WAIT: "Action: WAIT - no spraying needed"
  counts: "{pest_name}: {pests} per day, predators: {predators} per day."
  trend_rising: "Pest pressure is rising (about {pct}% per day)."
  trend_falling: "Pest pressure is falling."
  trend_stable: "Pest pressure is stable."
  crosses: "Expected to reach the action level in about {days} days."
  spray_ok: "Good time to spray now: no rain expected for the next {dry_hours} hours."
  spray_rain_soon: "Don't spray now: rain expected in about {hours} hours ({prob}% chance)."
  spray_raining: "Don't spray now: it is raining."
  spray_windy: "Don't spray now: strong wind ({wind} km/h)."
  spray_outside_hours: "Not a spraying hour now."
  spray_no_forecast: "No weather forecast - look at the sky before spraying."
  spray_next: "Next good time to spray: {when}."
  when_today: "today {time}"
  when_tomorrow: "tomorrow {time}"
  when_date: "{date} {time}"
  warning: "Warning: pest outbreak at {neighbour}, {km} km away. Check your crop."
  answer_no_need: "No need to spray today: {pest_name} is below the action level ({pests} per day)."
  answer_biocontrol: "Better not to spray: predators are keeping the pests down. Release more biocontrol instead."
  answer_need: "Yes, spraying is needed."
  sensor: "Trap now: {temp}°C, humidity {hum}%."

kn:
  title: "ಕೀಟಸೆನ್ಸ್ - {trap_name}"
  action_SPRAY: "ಕ್ರಮ: ಕೀಟನಾಶಕ ಸಿಂಪಡಿಸಿ"
  action_RELEASE_BIOCONTROL: "ಕ್ರಮ: ಜೈವಿಕ ನಿಯಂತ್ರಣ ಕೀಟಗಳನ್ನು ಬಿಡುಗಡೆ ಮಾಡಿ (ಸಿಂಪಡಿಸಬೇಡಿ)"
  action_WAIT: "ಕ್ರಮ: ಕಾಯಿರಿ - ಸಿಂಪಡಣೆ ಬೇಡ"
  counts: "{pest_name}: ದಿನಕ್ಕೆ {pests}, ಪರಭಕ್ಷಕ ಕೀಟಗಳು: ದಿನಕ್ಕೆ {predators}."
  trend_rising: "ಕೀಟಗಳ ಒತ್ತಡ ಹೆಚ್ಚುತ್ತಿದೆ (ದಿನಕ್ಕೆ ಸುಮಾರು {pct}%)."
  trend_falling: "ಕೀಟಗಳ ಒತ್ತಡ ಕಡಿಮೆಯಾಗುತ್ತಿದೆ."
  trend_stable: "ಕೀಟಗಳ ಒತ್ತಡ ಸ್ಥಿರವಾಗಿದೆ."
  crosses: "ಸುಮಾರು {days} ದಿನಗಳಲ್ಲಿ ಕ್ರಮದ ಮಿತಿ ತಲುಪುವ ನಿರೀಕ್ಷೆ."
  spray_ok: "ಈಗ ಸಿಂಪಡಿಸಲು ಸೂಕ್ತ ಸಮಯ: ಮುಂದಿನ {dry_hours} ಗಂಟೆ ಮಳೆ ಇಲ್ಲ."
  spray_rain_soon: "ಈಗ ಸಿಂಪಡಿಸಬೇಡಿ: ಸುಮಾರು {hours} ಗಂಟೆಗಳಲ್ಲಿ ಮಳೆ ಬರುವ ಸಾಧ್ಯತೆ ({prob}%)."
  spray_raining: "ಈಗ ಸಿಂಪಡಿಸಬೇಡಿ: ಮಳೆ ಬರುತ್ತಿದೆ."
  spray_windy: "ಈಗ ಸಿಂಪಡಿಸಬೇಡಿ: ಗಾಳಿ ಜೋರಾಗಿದೆ ({wind} ಕಿಮೀ/ಗಂ)."
  spray_outside_hours: "ಈಗ ಸಿಂಪಡಣೆಯ ಸಮಯವಲ್ಲ."
  spray_no_forecast: "ಹವಾಮಾನ ಮುನ್ಸೂಚನೆ ಲಭ್ಯವಿಲ್ಲ - ಸಿಂಪಡಿಸುವ ಮೊದಲು ಆಕಾಶ ನೋಡಿ."
  spray_next: "ಸಿಂಪಡಿಸಲು ಮುಂದಿನ ಸೂಕ್ತ ಸಮಯ: {when}."
  when_today: "ಇಂದು {time}"
  when_tomorrow: "ನಾಳೆ {time}"
  when_date: "{date} {time}"
  warning: "ಎಚ್ಚರಿಕೆ: {km} ಕಿಮೀ ದೂರದ {neighbour} ನಲ್ಲಿ ಕೀಟ ಹರಡುವಿಕೆ. ನಿಮ್ಮ ಬೆಳೆಯನ್ನು ಪರಿಶೀಲಿಸಿ."
  answer_no_need: "ಇಂದು ಸಿಂಪಡಿಸುವ ಅಗತ್ಯವಿಲ್ಲ: {pest_name} ಕ್ರಮದ ಮಿತಿಗಿಂತ ಕಡಿಮೆ (ದಿನಕ್ಕೆ {pests})."
  answer_biocontrol: "ಸಿಂಪಡಿಸದಿರುವುದು ಉತ್ತಮ: ಪರಭಕ್ಷಕ ಕೀಟಗಳು ಕೀಟಗಳನ್ನು ನಿಯಂತ್ರಿಸುತ್ತಿವೆ. ಬದಲಿಗೆ ಜೈವಿಕ ನಿಯಂತ್ರಣ ಕೀಟಗಳನ್ನು ಬಿಡುಗಡೆ ಮಾಡಿ."
  answer_need: "ಹೌದು, ಸಿಂಪಡಣೆ ಅಗತ್ಯವಿದೆ."
  sensor: "ಈಗ ಬಲೆಯಲ್ಲಿ: {temp}°C, ತೇವಾಂಶ {hum}%."

hi:
  title: "कीटसेंस - {trap_name}"
  action_SPRAY: "कार्रवाई: कीटनाशक का छिड़काव करें"
  action_RELEASE_BIOCONTROL: "कार्रवाई: जैविक नियंत्रण कीट छोड़ें (छिड़काव न करें)"
  action_WAIT: "कार्रवाई: इंतज़ार करें - छिड़काव की ज़रूरत नहीं"
  counts: "{pest_name}: प्रतिदिन {pests}, शिकारी कीट: प्रतिदिन {predators}।"
  trend_rising: "कीटों का दबाव बढ़ रहा है (प्रतिदिन लगभग {pct}%)।"
  trend_falling: "कीटों का दबाव घट रहा है।"
  trend_stable: "कीटों का दबाव स्थिर है।"
  crosses: "लगभग {days} दिनों में कार्रवाई सीमा तक पहुँचने की संभावना है।"
  spray_ok: "अभी छिड़काव का सही समय है: अगले {dry_hours} घंटे बारिश नहीं।"
  spray_rain_soon: "अभी छिड़काव न करें: लगभग {hours} घंटे में बारिश की संभावना ({prob}%)।"
  spray_raining: "अभी छिड़काव न करें: बारिश हो रही है।"
  spray_windy: "अभी छिड़काव न करें: तेज़ हवा ({wind} किमी/घंटा)।"
  spray_outside_hours: "अभी छिड़काव का समय नहीं है।"
  spray_no_forecast: "मौसम पूर्वानुमान उपलब्ध नहीं - छिड़काव से पहले आसमान देखें।"
  spray_next: "छिड़काव का अगला सही समय: {when}।"
  when_today: "आज {time}"
  when_tomorrow: "कल {time}"
  when_date: "{date} {time}"
  warning: "चेतावनी: {km} किमी दूर {neighbour} में कीटों का प्रकोप। अपनी फसल जाँचें।"
  answer_no_need: "आज छिड़काव की ज़रूरत नहीं: {pest_name} कार्रवाई सीमा से कम है (प्रतिदिन {pests})।"
  answer_biocontrol: "छिड़काव न करना बेहतर है: शिकारी कीट कीटों को नियंत्रित कर रहे हैं। इसकी जगह जैविक नियंत्रण कीट छोड़ें।"
  answer_need: "हाँ, छिड़काव ज़रूरी है।"
  sensor: "अभी ट्रैप पर: {temp}°C, नमी {hum}%।"

ta:
  title: "கீடசென்ஸ் - {trap_name}"
  action_SPRAY: "நடவடிக்கை: பூச்சிக்கொல்லி தெளிக்கவும்"
  action_RELEASE_BIOCONTROL: "நடவடிக்கை: உயிரியல் கட்டுப்பாட்டு பூச்சிகளை விடுவிக்கவும் (தெளிக்க வேண்டாம்)"
  action_WAIT: "நடவடிக்கை: காத்திருக்கவும் - தெளிப்பு தேவையில்லை"
  counts: "{pest_name}: நாளொன்றுக்கு {pests}, இரைகொல்லி பூச்சிகள்: நாளொன்றுக்கு {predators}."
  trend_rising: "பூச்சி அழுத்தம் அதிகரிக்கிறது (நாளொன்றுக்கு சுமார் {pct}%)."
  trend_falling: "பூச்சி அழுத்தம் குறைகிறது."
  trend_stable: "பூச்சி அழுத்தம் நிலையாக உள்ளது."
  crosses: "சுமார் {days} நாட்களில் நடவடிக்கை வரம்பை எட்டும் என எதிர்பார்க்கப்படுகிறது."
  spray_ok: "இப்போது தெளிக்க ஏற்ற நேரம்: அடுத்த {dry_hours} மணி நேரம் மழை இல்லை."
  spray_rain_soon: "இப்போது தெளிக்க வேண்டாம்: சுமார் {hours} மணி நேரத்தில் மழை வர வாய்ப்பு ({prob}%)."
  spray_raining: "இப்போது தெளிக்க வேண்டாம்: மழை பெய்கிறது."
  spray_windy: "இப்போது தெளிக்க வேண்டாம்: பலத்த காற்று ({wind} கிமீ/மணி)."
  spray_outside_hours: "இப்போது தெளிக்கும் நேரம் அல்ல."
  spray_no_forecast: "வானிலை முன்னறிவிப்பு கிடைக்கவில்லை - தெளிக்கும் முன் வானத்தைப் பாருங்கள்."
  spray_next: "தெளிக்க அடுத்த ஏற்ற நேரம்: {when}."
  when_today: "இன்று {time}"
  when_tomorrow: "நாளை {time}"
  when_date: "{date} {time}"
  warning: "எச்சரிக்கை: {km} கிமீ தொலைவில் உள்ள {neighbour}-இல் பூச்சித் தாக்குதல். உங்கள் பயிரைச் சரிபாருங்கள்."
  answer_no_need: "இன்று தெளிக்கத் தேவையில்லை: {pest_name} நடவடிக்கை வரம்புக்குக் கீழே உள்ளது (நாளொன்றுக்கு {pests})."
  answer_biocontrol: "தெளிக்காமல் இருப்பது நல்லது: இரைகொல்லி பூச்சிகள் பூச்சிகளைக் கட்டுப்படுத்துகின்றன. அதற்குப் பதிலாக உயிரியல் கட்டுப்பாட்டு பூச்சிகளை விடுவிக்கவும்."
  answer_need: "ஆம், தெளிப்பு தேவை."
  sensor: "இப்போது பொறியில்: {temp}°C, ஈரப்பதம் {hum}%."
