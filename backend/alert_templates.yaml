# Telegram alert templates (English, Kannada, Hindi, Tamil)
# =========================================================
# !!! The Kannada, Hindi and Tamil texts were machine-drafted. A NATIVE SPEAKER
# !!! OF EACH LANGUAGE MUST CHECK AND CORRECT THE WORDING before farmers receive it.
# Which languages are sent: ALERT_LANGUAGES in .env (e.g. en,kn or en,kn,hi,ta).
#
# Placeholders filled in by backend/alerts.py:
#   {trap_name} {pest_name} {pests_per_day} {predators_per_day} {ratio}
#   {days_text} {reason}
# {pest_name} and {days_text} are already in the right language.

en:
  days_known: "about {days} days"
  days_unknown: "not known yet"
  SPRAY: |
    🔴 KeetaSense - {trap_name}
    Action: SPRAY
    {reason}
  RELEASE_BIOCONTROL: |
    🟠 KeetaSense - {trap_name}
    Action: RELEASE BIOCONTROL
    {reason}
  WAIT: |
    🟢 KeetaSense - {trap_name}
    Action: WAIT
    {reason}
  CHECK_TRAP: |
    ⚪ KeetaSense - {trap_name}
    Action: CHECK TRAP
    The latest photo is not usable: {quality_text}. No spray or release advice until a good photo arrives.
  button_sprayed: "✅ Sprayed"
  button_released: "🐞 Released"
  button_not_yet: "⏳ Not yet"
  borderline: "⚖ Borderline: {low} to {high} {pest_name} per day - the photo count is uncertain. Check the field before acting."
  support_harm: "Spraying would also kill about {n} predators in this trap's area (estimate, placeholder rates)."
  support_release: "Release about {n} {predator} for ~{area} m²; check the trap again on {date} (placeholder rates)."

kn:
  days_known: "ಸುಮಾರು {days} ದಿನಗಳಲ್ಲಿ"
  days_unknown: "ಇನ್ನೂ ತಿಳಿದಿಲ್ಲ"
  SPRAY: |
    🔴 ಕೀಟಸೆನ್ಸ್ - {trap_name}
    ಕ್ರಮ: ಕೀಟನಾಶಕ ಸಿಂಪಡಿಸಿ
    {pest_name}: ದಿನಕ್ಕೆ ಸರಾಸರಿ {pests_per_day}. ಪ್ರತಿ ಪರಭಕ್ಷಕ ಕೀಟಕ್ಕೆ {ratio} ಹಾನಿಕಾರಕ ಕೀಟಗಳು - ಪರಭಕ್ಷಕಗಳು ನಿಯಂತ್ರಿಸಲು ಸಾಕಾಗುತ್ತಿಲ್ಲ.
    ಮುಂದಿನ ಪೀಳಿಗೆ: {days_text}.
  RELEASE_BIOCONTROL: |
    🟠 ಕೀಟಸೆನ್ಸ್ - {trap_name}
    ಕ್ರಮ: ಜೈವಿಕ ನಿಯಂತ್ರಣ ಕೀಟಗಳನ್ನು ಬಿಡುಗಡೆ ಮಾಡಿ
    {pest_name}: ದಿನಕ್ಕೆ ಸರಾಸರಿ {pests_per_day}, ಆದರೆ ಪರಭಕ್ಷಕ ಕೀಟಗಳು ಸಮನಾಗಿ ಹೆಚ್ಚುತ್ತಿವೆ. ಸಿಂಪಡಣೆ ಮಾಡಬೇಡಿ - ಅದು ಪರಭಕ್ಷಕಗಳನ್ನೂ ಕೊಲ್ಲುತ್ತದೆ.
    ಮುಂದಿನ ಪೀಳಿಗೆ: {days_text}.
  WAIT: |
    🟢 ಕೀಟಸೆನ್ಸ್ - {trap_name}
    ಕ್ರಮ: ಕಾಯಿರಿ
    {pest_name}: ದಿನಕ್ಕೆ ಸರಾಸರಿ {pests_per_day} - ಮಿತಿಗಿಂತ ಕಡಿಮೆ. ಗಮನಿಸುತ್ತಿರಿ.
    ಮುಂದಿನ ಪೀಳಿಗೆ: {days_text}.
  CHECK_TRAP: |
    ⚪ ಕೀಟಸೆನ್ಸ್ - {trap_name}
    ಕ್ರಮ: ಬಲೆಯನ್ನು ಪರಿಶೀಲಿಸಿ
    ಇತ್ತೀಚಿನ ಚಿತ್ರ ಬಳಸಲು ಯೋಗ್ಯವಾಗಿಲ್ಲ: {quality_text}. ಉತ್ತಮ ಚಿತ್ರ ಬರುವವರೆಗೆ ಸಿಂಪಡಣೆ ಅಥವಾ ಬಿಡುಗಡೆ ಸಲಹೆ ಇಲ್ಲ.
  button_sprayed: "✅ ಸಿಂಪಡಿಸಿದೆ"
  button_released: "🐞 ಬಿಡುಗಡೆ ಮಾಡಿದೆ"
  button_not_yet: "⏳ ಇನ್ನೂ ಇಲ್ಲ"
  borderline: "⚖ ಗಡಿರೇಖೆಯಲ್ಲಿದೆ: ದಿನಕ್ಕೆ {low} ರಿಂದ {high} {pest_name} - ಚಿತ್ರದ ಎಣಿಕೆ ಖಚಿತವಿಲ್ಲ. ಕ್ರಮ ಕೈಗೊಳ್ಳುವ ಮೊದಲು ಹೊಲವನ್ನು ಪರಿಶೀಲಿಸಿ."
  support_harm: "ಸಿಂಪಡಣೆಯು ಈ ಬಲೆಯ ಪ್ರದೇಶದಲ್ಲಿ ಸುಮಾರು {n} ಪರಭಕ್ಷಕ ಕೀಟಗಳನ್ನೂ ಕೊಲ್ಲುತ್ತದೆ (ಅಂದಾಜು, ತಾತ್ಕಾಲಿಕ ದರಗಳು)."
  support_release: "~{area} ಚ.ಮೀ.ಗೆ ಸುಮಾರು {n} {predator} ಬಿಡುಗಡೆ ಮಾಡಿ; {date} ರಂದು ಬಲೆಯನ್ನು ಮತ್ತೆ ಪರಿಶೀಲಿಸಿ (ತಾತ್ಕಾಲಿಕ ದರಗಳು)."

hi:
  days_known: "लगभग {days} दिनों में"
  days_unknown: "अभी पता नहीं"
  SPRAY: |
    🔴 कीटसेंस - {trap_name}
    कार्रवाई: कीटनाशक का छिड़काव करें
    {pest_name}: प्रतिदिन औसतन {pests_per_day}। हर शिकारी कीट पर {ratio} हानिकारक कीट - शिकारी कीट नियंत्रण नहीं कर पा रहे।
    अगली पीढ़ी: {days_text}।
  RELEASE_BIOCONTROL: |
    🟠 कीटसेंस - {trap_name}
    कार्रवाई: जैविक नियंत्रण कीट छोड़ें
    {pest_name}: प्रतिदिन औसतन {pests_per_day}, लेकिन शिकारी कीट भी साथ-साथ बढ़ रहे हैं। छिड़काव न करें - इससे शिकारी कीट भी मर जाएँगे।
    अगली पीढ़ी: {days_text}।
  WAIT: |
    🟢 कीटसेंस - {trap_name}
    कार्रवाई: इंतज़ार करें
    {pest_name}: प्रतिदिन औसतन {pests_per_day} - सीमा से कम। निगरानी जारी रखें।
    अगली पीढ़ी: {days_text}।
  CHECK_TRAP: |
    ⚪ कीटसेंस - {trap_name}
    कार्रवाई: ट्रैप जाँचें
    नवीनतम फ़ोटो उपयोग योग्य नहीं: {quality_text}। अच्छी फ़ोटो आने तक छिड़काव या छोड़ने की सलाह नहीं।
  button_sprayed: "✅ छिड़काव किया"
  button_released: "🐞 छोड़ दिए"
  button_not_yet: "⏳ अभी नहीं"
  borderline: "⚖ सीमा पर: प्रतिदिन {low} से {high} {pest_name} - फ़ोटो की गिनती अनिश्चित है। कार्रवाई से पहले खेत जाँचें।"
  support_harm: "छिड़काव से इस ट्रैप के क्षेत्र में लगभग {n} शिकारी कीट भी मर जाएँगे (अनुमान, अस्थायी दरें)।"
  support_release: "~{area} वर्ग मीटर के लिए लगभग {n} {predator} छोड़ें; {date} को ट्रैप फिर जाँचें (अस्थायी दरें)।"

ta:
  days_known: "சுமார் {days} நாட்களில்"
  days_unknown: "இன்னும் தெரியவில்லை"
  SPRAY: |
    🔴 கீடசென்ஸ் - {trap_name}
    நடவடிக்கை: பூச்சிக்கொல்லி தெளிக்கவும்
    {pest_name}: நாளொன்றுக்கு சராசரி {pests_per_day}. ஒவ்வொரு இரைகொல்லி பூச்சிக்கும் {ratio} தீங்கு செய்யும் பூச்சிகள் - இரைகொல்லிகளால் கட்டுப்படுத்த முடியவில்லை.
    அடுத்த தலைமுறை: {days_text}.
  RELEASE_BIOCONTROL: |
    🟠 கீடசென்ஸ் - {trap_name}
    நடவடிக்கை: உயிரியல் கட்டுப்பாட்டு பூச்சிகளை விடுவிக்கவும்
    {pest_name}: நாளொன்றுக்கு சராசரி {pests_per_day}, ஆனால் இரைகொல்லி பூச்சிகளும் சமமாக அதிகரிக்கின்றன. தெளிக்க வேண்டாம் - அது இரைகொல்லிகளையும் கொல்லும்.
    அடுத்த தலைமுறை: {days_text}.
  WAIT: |
    🟢 கீடசென்ஸ் - {trap_name}
    நடவடிக்கை: காத்திருக்கவும்
    {pest_name}: நாளொன்றுக்கு சராசரி {pests_per_day} - வரம்புக்குக் கீழே. கண்காணித்துக் கொண்டே இருங்கள்.
    அடுத்த தலைமுறை: {days_text}.
  CHECK_TRAP: |
    ⚪ கீடசென்ஸ் - {trap_name}
    நடவடிக்கை: பொறியைச் சரிபார்க்கவும்
    சமீபத்திய படம் பயன்படுத்த முடியாது: {quality_text}. நல்ல படம் வரும் வரை தெளிப்பு அல்லது விடுவிப்பு ஆலோசனை இல்லை.
  button_sprayed: "✅ தெளித்தேன்"
  button_released: "🐞 விடுவித்தேன்"
  button_not_yet: "⏳ இன்னும் இல்லை"
  borderline: "⚖ எல்லையில்: நாளொன்றுக்கு {low} முதல் {high} {pest_name} - படத்தின் எண்ணிக்கை உறுதியாக இல்லை. நடவடிக்கைக்கு முன் வயலைச் சரிபாருங்கள்."
  support_harm: "தெளிப்பு இந்தப் பொறியின் பகுதியில் சுமார் {n} இரைகொல்லி பூச்சிகளையும் கொல்லும் (மதிப்பீடு, தற்காலிக விகிதங்கள்)."
  support_release: "~{area} ச.மீ.க்கு சுமார் {n} {predator} விடுவிக்கவும்; {date} அன்று பொறியை மீண்டும் சரிபார்க்கவும் (தற்காலிக விகிதங்கள்)."
