# KeetaSense - insect classes and decision thresholds
# =====================================================
# This is the ONLY place where insect classes are mapped to a category
# ("pest" or "predator"). The ML converter, the detector and the decision
# engine all read this file. Nothing about classes is hardcoded in code.
#
# IMPORTANT: every number in the "thresholds" section below is a placeholder
# chosen so the demo behaves sensibly. They MUST be confirmed with the
# ICAR-IIHR mentor before any real-world use.

# ---------------------------------------------------------------------------
# 1. Classes the model detects
# ---------------------------------------------------------------------------
# The order of this list defines the YOLO class ids (0, 1, 2, ...).
# "aliases" are the label names that may appear in raw datasets; the dataset
# converter maps any alias (case-insensitive) to the canonical "name".
# The Wageningen "Yellow Sticky Traps" dataset uses WF / MR / NC.
# display_kn / display_hi / display_ta: machine-drafted names - a native speaker must check them.
# "synthetic_shape" (round | stout | slim) is ONLY used by the synthetic test
# image generator and the DEMO DETECTOR - never by the real trained model.
# "confidence_threshold" (optional, 0-1): the AI model must be at least this
# sure before a box of this class is counted. Lower = finds more insects but
# more false alarms. Without it, KEETA_CONF_THRESHOLD from .env (0.25) is used.
# Tune it per class with ml/evaluate.py on the real test split.
classes:
  - name: whitefly
    category: pest
    display_en: Whitefly
    display_kn: ಬಿಳಿ ನೊಣ
    display_hi: सफ़ेद मक्खी
    display_ta: வெள்ளை ஈ
    synthetic_shape: round
    confidence_threshold: 0.25
    aliases: [WF, whitefly, whiteflies, white_fly, trialeurodes, bemisia]
  - name: macrolophus
    category: predator
    display_en: Macrolophus (predator bug)
    display_kn: ಮ್ಯಾಕ್ರೊಲೋಫಸ್ (ಪರಭಕ್ಷಕ ತಿಗಣೆ)
    display_hi: मैक्रोलोफस (शिकारी कीट)
    display_ta: மேக்ரோலோபஸ் (இரைகொல்லி பூச்சி)
    synthetic_shape: stout
    confidence_threshold: 0.25
    aliases: [MR, macrolophus, macrolophus_pygmaeus]
  - name: nesidiocoris
    category: predator
    display_en: Nesidiocoris (predator bug)
    display_kn: ನೆಸಿಡಿಯೊಕೊರಿಸ್ (ಪರಭಕ್ಷಕ ತಿಗಣೆ)
    display_hi: नेसिडियोकोरिस (शिकारी कीट)
    display_ta: நெசிடியோகோரிஸ் (இரைகொல்லி பூச்சி)
    synthetic_shape: slim
    confidence_threshold: 0.25
    aliases: [NC, nesidiocoris, nesidiocoris_tenuis]

# ---------------------------------------------------------------------------
# 2. Decision thresholds, per target pest
# ---------------------------------------------------------------------------
# Each trap in traps.yaml names a target pest (e.g. whitefly); the decision
# engine uses that pest's block below.
thresholds:
  whitefly:
    # Lower developmental temperature threshold (deg C) for degree-days.
    base_temp_c: 10.0  # PLACEHOLDER - confirm with IIHR mentor
    # Degree-days needed for one whitefly generation (egg to adult).
    degree_days_per_generation: 300.0  # PLACEHOLDER - confirm with IIHR mentor
    # Average pests caught per tape section (= per day) that triggers action.
    action_threshold_per_day: 25  # PLACEHOLDER - confirm with IIHR mentor
    # Pest-to-predator ratio at or above which predators are NOT keeping pace.
    # Below this ratio, predators are keeping pace -> release more biocontrol.
    spray_ratio: 10.0  # PLACEHOLDER - confirm with IIHR mentor
    # How many of the most recent tape sections (days) to average over.
    rolling_window_days: 3  # PLACEHOLDER - confirm with IIHR mentor

# ---------------------------------------------------------------------------
# 3. Image quality gate (every new tape photo, backend/image_quality.py)
# ---------------------------------------------------------------------------
# Measured on our synthetic demo images: sharp ~16, 9 px blur ~2; normal brightness ~189;
# different tape sections similarity ~0.0, the same section re-photographed ~0.96.
# Re-check every value on the real Pi camera before the event.
image_quality:
  blur_bad: 3              # PLACEHOLDER - confirm on the real Pi camera (Laplacian variance below = BAD)
  blur_warn: 8             # PLACEHOLDER - confirm on the real Pi camera
  dark_bad: 50             # PLACEHOLDER - confirm on the real Pi camera (mean grey 0-255)
  dark_warn: 90            # PLACEHOLDER - confirm on the real Pi camera
  bright_bad: 245          # PLACEHOLDER - confirm on the real Pi camera
  glare_bad_pct: 10        # PLACEHOLDER - confirm on the real Pi camera (% saturated pixels)
  glare_warn_pct: 3        # PLACEHOLDER - confirm on the real Pi camera
  duplicate_bad: 0.8       # PLACEHOLDER - confirm on the real Pi camera (similarity to previous capture)
  duplicate_warn: 0.6      # PLACEHOLDER - confirm on the real Pi camera

# ---------------------------------------------------------------------------
# 4. Farmer actions (F4): logging, cooldown, before/after effect
# ---------------------------------------------------------------------------
actions:
  # After "sprayed" or "released", repeat SPRAY / BIOCONTROL alerts for that trap are held back
  # for this long (the action needs time to work; CHECK TRAP alerts are never held back).
  cooldown_hours: 48             # PLACEHOLDER - confirm with IIHR mentor
  # Effect card: average whitefly per tape section this many days before vs after an action.
  effect_window_days: 3          # Team decision (prep-round brief: 3 days before vs after)

# ---------------------------------------------------------------------------
# 5. Confidence-aware decisions (F2)
# ---------------------------------------------------------------------------
# Count range = [count x mean confidence, count / mean confidence]. If the advice could differ
# anywhere in that range, it is shown as BORDERLINE with the range.
confidence:
  min_confidence: 0.5            # PLACEHOLDER - confirm with the trained model's evaluation (confidence floor)

# ---------------------------------------------------------------------------
# 6. Decision intelligence (F5): cost of spraying + biocontrol dosing, per target pest
# ---------------------------------------------------------------------------
# Every rate below is unknown to the team - replace with IIHR mentor values.
decision_support:
  whitefly:
    # Area of crop one trap represents (the "area per trap" setting).
    area_per_trap_m2: 1000             # PLACEHOLDER - confirm with IIHR mentor
    # Predators living in the trap's area for every predator the trap catches per day.
    predators_in_field_per_trapped: 40 # PLACEHOLDER - confirm with IIHR mentor
    # Biocontrol release rate (predators per square metre) and which predator to release.
    release_rate_per_m2: 2             # PLACEHOLDER - confirm with IIHR mentor
    release_class: macrolophus
    # Days after a release to check the trap again.
    recheck_days: 7                    # PLACEHOLDER - confirm with IIHR mentor

# Crops on the What-if page and the pest each one is monitored for.
crops:
  tomato: whitefly

# ---------------------------------------------------------------------------
# 7. Trap health + alert hygiene (F6)
# ---------------------------------------------------------------------------
health:
  # A trap is OFFLINE when no heartbeat arrived for this many capture intervals.
  offline_after_intervals: 2     # Team decision (prep-round brief: more than 2x the capture interval)
  # Alert when less than this % of the tape roll is left.
  tape_low_pct: 15               # Team decision (prep-round brief: tape below 15%)
alert_hygiene:
  # No alerts are delivered between these hours (24 h clock); they are held and sent at the end.
  quiet_hours_start: 21          # PLACEHOLDER - confirm with the farmers
  quiet_hours_end: 6             # PLACEHOLDER - confirm with the farmers
  # One daily summary per trap at this time.
  digest_hour: 7                 # PLACEHOLDER - confirm with the farmers
  digest_minute: 0               # PLACEHOLDER - confirm with the farmers
  # The summary reports the newest tape photo only if it is at most this old (else "no new photo").
  digest_max_photo_age_hours: 36 # Team decision - a daily trap plus a few hours' slack
  # An action alert that nobody acknowledged (Sprayed / Released / Not yet) is repeated ONCE after this.
  realert_after_hours: 4         # PLACEHOLDER - confirm with the farmers
